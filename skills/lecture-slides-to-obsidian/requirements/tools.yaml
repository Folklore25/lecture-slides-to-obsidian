schema_version: 1

required_tools:
  - name: "obsidian"
    purpose: "Perform vault-native reads, writes, moves, opens, and final artifact checks."
    source: "https://obsidian.md/help/cli"
    verify_command: "obsidian version"
    tested_version: "1.13.7 (installer 1.12.4)"
  - name: "mineru-open-api"
    purpose: "Official MinerU client for authenticated extraction, polling, and Markdown/assets/JSON output."
    source: "https://github.com/opendatalab/MinerU-Ecosystem/tree/main/cli/mineru-open-api"
    verify_command: "mineru-open-api version"
    tested_version: "0.5.9"
    install:
      npm: "npm install -g mineru-open-api"
      uv: "uv tool install mineru-open-api"
    token_transport: "MINERU_TOKEN child-process environment only"
    direct_http_fallback: "forbidden"
  - name: "openssl"
    purpose: "Encrypt and decrypt the MinerU API token stored inside the installed skill directory."
    verify_command: "openssl version"
    required_cipher: "aes-256-cbc"
    token_store:
      file: "state/mineru-api-token.enc.json"
      file_mode: "0600"
      directory_mode: "0700"
      cipher: "AES-256-CBC"
      cipher_kdf: "PBKDF2-HMAC-SHA256"
      cipher_iterations: 600000
      integrity: "Encrypt-then-HMAC-SHA256"
      mac_kdf: "PBKDF2-HMAC-SHA256"
      mac_iterations: 600000
      wrapping_key_backend: "macos-keychain"
      wrapping_key_service: "lecture-slides-to-obsidian.mineru-token-key"
  - name: "security"
    purpose: "Store and retrieve the random wrapping key from macOS Keychain without repeated user input."
    verify_command: "security help"
    platform: "macos"
