schema_version: 1

extraction_modes:
  native:
    default: true
    description: "A natively multimodal model reads the source PDF or slide deck directly."
    network_upload_required: false
    requires_credentials: false
    requires_multimodal_model: true
  mineru:
    default: false
    description: "Optional aid: the official MinerU CLI returns structured page groups."
    network_upload_required: true
    requires_credentials: true

optional_services:
  - name: "mineru-precision-api"
    provider: "MinerU"
    api_version: "v4"
    base_url: "https://mineru.net"
    docs: "https://mineru.net/apiManage/docs"
    used_only_with_extraction_mode: "mineru"
    network_upload_required: true
    client:
      name: "mineru-open-api"
      command: "extract"
      direct_http_calls: false
      formats:
        - "md"
        - "json"
    authentication:
      type: "bearer"
      token_source: "encrypted-skill-state-file"
      encrypted_file: "state/mineru-api-token.enc.json"
      persistence: "encrypted-at-rest"
      wrapping_key_backend: "macos-keychain"
      repeated_user_confirmation: false
      allowed_origin: "https://mineru.net"
      cli_environment: "MINERU_TOKEN"
      cli_config_file_write: false
    defaults:
      model_version: "vlm"
      enable_formula: true
      enable_table: true
    required_confirmation:
      is_ocr:
        type: "boolean"
        default: null
      language:
        type: "enum"
        default: null
        selection: "infer-from-user-filename-course-then-confirm"
    limits:
      max_file_bytes: 209715200
      max_pages: 200
    result:
      markdown: "<source-stem>.md with downloaded assets"
      content_list: "<source-stem>.json"
      normalized_page_groups: "<source-stem>.content-list-v2.compat.json"
