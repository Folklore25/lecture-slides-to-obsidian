schema_version: 1
install_behavior: "report-only"

extraction_modes:
  native:
    default: true
    requires_multimodal_model: true
  mineru:
    default: false
    requires_mineru_cli: true

required_skills:
  - name: "obsidian-markdown"
    purpose: "Normalize and validate Obsidian properties, wikilinks, embeds, callouts, comments, and Markdown conventions."
    source: "https://github.com/kepano/obsidian-skills/tree/main/skills/obsidian-markdown"
    verify:
      skill_name: "obsidian-markdown"

  - name: "obsidian-cli"
    purpose: "Perform vault-native note operations and support final package verification."
    source: "https://github.com/kepano/obsidian-skills/tree/main/skills/obsidian-cli"
    verify:
      skill_name: "obsidian-cli"

  - name: "obsidian-canvas-designer"
    purpose: "Accept a semantic recall model and independently design, render, and verify the knowledge-recall Canvas."
    source: "../obsidian-canvas-designer"
    verify:
      skill_name: "obsidian-canvas-designer"

optional_skills:
  - name: "slide-layout-refiner"
    purpose: "Restore page-local hierarchy and asset placement inside MinerU source-page segments without changing content or page separation."
    source: "../slide-layout-refiner"
    enabled_by_default: false
    enabled_only_with_extraction_mode: "mineru"
    enabled_only_for_profiles:
      - "policy-document"
      - "paper"
    superseded_by: "native-multimodal-synthesis"
    requires_visual_input: true
  - name: "obsidian-latex-refiner"
    purpose: "Normalize LaTeX math in an Obsidian note so it renders in MathJax, with an agent-driven scan, conservation checks, and automatic rollback. Marker-free notes are treated as one segment."
    source: "../obsidian-latex-refiner"
    enabled_by_default: false
    requires_multimodal: false
    agent_driven: true
