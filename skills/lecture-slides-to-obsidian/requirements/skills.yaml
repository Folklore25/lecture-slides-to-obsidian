schema_version: 1
install_behavior: "report-only"

required_skills:
  - name: "obsidian-markdown"
    purpose: "Normalize and validate Obsidian properties, wikilinks, embeds, callouts, comments, and Markdown conventions."
    source: "https://github.com/kepano/obsidian-skills/tree/main/skills/obsidian-markdown"
    verify:
      skill_name: "obsidian-markdown"

  - name: "obsidian-cli"
    purpose: "Perform vault-native note operations and support final package verification."
    source: "https://github.com/kepano/obsidian-skills/tree/main/skills/obsidian-cli"
    verify:
      skill_name: "obsidian-cli"

  - name: "obsidian-canvas-designer"
    purpose: "Accept a semantic recall model and independently design, render, and verify the knowledge-recall Canvas."
    source: "../obsidian-canvas-designer"
    verify:
      skill_name: "obsidian-canvas-designer"

optional_skills:
  - name: "slide-layout-refiner"
    purpose: "Use a multimodal model to restore page-local slide hierarchy and asset placement without changing content or source-page separation."
    source: "../slide-layout-refiner"
    enabled_by_default: false
    preferred_model: "MiniMax-M3"
