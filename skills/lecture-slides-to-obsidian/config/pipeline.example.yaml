schema_version: 1

input:
  preserve_source: true
  copy_source_into_course: true

course_routing:
  registry: "state/course-registry.yaml"
  unmatched_course: "use-active-semester-or-ask-root"
  require_unique_match: true
  create_default_subfolders: true

output:
  overwrite: false
  note_name: "{source_stem}.md"
  assets_directory: "assets/{source_stem}"
  report_name: "{source_stem}.conversion-report.md"

mineru_api:
  base_url: "https://mineru.net"
  api_version: "v4"
  submission: "signed-batch-upload"
  model_version: "vlm"
  token_source: "interactive-plaintext"
  persist_token: false
  language: "ch"
  enable_formula: true
  enable_table: true
  is_ocr: false
  poll_interval_seconds: 3
  poll_timeout_seconds: 300

conversion:
  page_provenance: "html-comment"
  visual_fallback: "uncertain-pages"
  equation_policy: "preserve-and-flag"
  table_policy: "markdown-or-image"

obsidian:
  wikilinks: false
  warning_callouts: true
  relative_asset_links: true
