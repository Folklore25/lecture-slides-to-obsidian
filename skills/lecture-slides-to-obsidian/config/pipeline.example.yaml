schema_version: 1

input:
  preserve_source: true
  copy_source_into_vault: false
  reject_source_inside_vault: true

course_routing:
  registry: "state/course-registry.yaml"
  unmatched_course: "use-active-semester-or-ask-root"
  require_unique_match: true
  create_default_subfolders: true

output:
  overwrite: false
  document_folder: "{document_slug}"
  note_name: "{document_slug}.md"
  canvas_name: "{document_slug}.canvas"
  assets_directory: "assets"

staging:
  report_name: "conversion-report.md"
  report_inside_vault: false
  delete_report_on_success: true

mineru_cli:
  executable: "mineru-open-api"
  command: "extract"
  direct_http_calls: false
  output_formats:
    - "md"
    - "json"
  model_version: "vlm"
  token_source: "state/mineru-api-token.enc.json"
  token_transport: "MINERU_TOKEN child environment"
  token_encryption: "aes-256-cbc-pbkdf2-etm-hmac-sha256"
  wrapping_key_backend: "macos-keychain"
  persist_plaintext_token: false
  language: null
  language_selection: "infer-then-confirm"
  enable_formula: true
  enable_table: true
  is_ocr: null
  require_explicit_language: true
  require_explicit_is_ocr: true
  timeout_seconds: 300

conversion:
  profile: "auto-confirm"
  profiles:
    - "lecture-notes"
    - "policy-document"
    - "paper"
  page_source: "content-list-v2-or-page-idx"
  page_provenance: "html-comment"
  visual_fallback: "uncertain-pages"
  equation_policy: "preserve-and-flag"
  table_policy: "markdown-or-image"

obsidian:
  wikilinks: true
  warning_callouts: true
  relative_asset_links: true
  relationship_canvas: true
