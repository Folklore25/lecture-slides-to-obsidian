schema_version: 1

input:
  preserve_source: true
  copy_source_into_vault: false
  reject_source_inside_vault: true

course_routing:
  registry: "state/course-registry.yaml"
  unmatched_course: "use-active-semester-or-ask-root"
  require_unique_match: true
  create_default_subfolders: true

output:
  overwrite: false
  document_folder: "{document_slug}"
  note_name: "{document_slug}.md"
  canvas_name: "{document_slug}.canvas"
  assets_directory: "assets"
  asset_name_pattern: "page-{page:03d}-{kind}-{index:02d}.{ext}"
  asset_kinds:
    - "figure"
    - "table"
    - "equation"
    - "chart"
    - "fallback"

staging:
  root: "system-temporary-directory"
  fallback_root: "installed-skill/tmp"
  allow_inside_vault: false
  create_dot_prefixed_paths_in_vault: false
  report_name: "conversion-report.md"
  layout_refinement_report_name: "layout-refinement-report.json"
  recall_model_name: "recall-model.json"
  canvas_aesthetic_check_name: "canvas-aesthetic-check.json"
  canvas_render_metrics_name: "canvas-render-metrics.json"
  canvas_render_check_name: "canvas-render-check.json"
  report_inside_vault: false
  recall_model_inside_vault: false
  delete_qa_on_success: true

mineru_cli:
  executable: "mineru-open-api"
  command: "extract"
  direct_http_calls: false
  output_formats:
    - "md"
    - "json"
  model_version: "vlm"
  token_source: "state/mineru-api-token.enc.json"
  token_transport: "MINERU_TOKEN child environment"
  token_encryption: "aes-256-cbc-pbkdf2-etm-hmac-sha256"
  wrapping_key_backend: "macos-keychain"
  persist_plaintext_token: false
  language: null
  language_selection: "infer-then-confirm"
  enable_formula: true
  enable_table: true
  is_ocr: null
  require_explicit_language: true
  require_explicit_is_ocr: true
  timeout_seconds: 300

conversion:
  profile: "auto-confirm"
  profiles:
    - "lecture-notes"
    - "policy-document"
    - "paper"
  page_source: "content-list-v2-or-page-idx"
  page_provenance: "html-comment"
  visual_fallback: "uncertain-pages"
  equation_policy: "preserve-and-flag"
  table_policy: "markdown-or-image"
  visual_layout_refinement:
    enabled: false
    skill: "slide-layout-refiner"
    requires_multimodal: true
    requires_visual_input: true
    accepted_source_views:
      - "original-pdf"
      - "rendered-page-images"
    source_format: "pdf"
    scope: "inside-source-page-markers-only"
    write_mode: "overwrite-final-markdown"
    snapshot_location: "staging-outside-vault"
    on_failure: "restore-snapshot-without-confirmation"

obsidian:
  wikilinks: true
  warning_callouts: true
  relative_asset_links: true
  canvas_skill: "obsidian-canvas-designer"
  delegate_canvas_to_subagent: true
  canvas_purpose: "one-minute-knowledge-recall"
  canvas_semantic_model_required: true
  canvas_concept_nodes: "4..20"
  canvas_learning_modules: "2..7"
  canvas_memory_critical_assets_max: 6
  canvas_aesthetic_minimum_score: 85
  canvas_required_qa:
    - "canvas-aesthetic-check.json"
    - "canvas-render-metrics.json"
    - "canvas-render-check.json"
