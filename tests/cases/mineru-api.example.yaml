schema_version: 1

cases:
  - id: "local-pdf-signed-upload"
    input: "lecture.pdf"
    expected_sequence:
      - "post-file-urls-batch-with-bearer"
      - "put-file-to-signed-url-without-bearer-or-content-type"
      - "poll-extract-results-batch-with-bearer"
      - "download-zip-without-bearer"
      - "safe-extract-in-staging"

  - id: "bearer-forwarded-to-signed-url"
    upload_authorization_header: true
    expected_action: "reject-request"

  - id: "signed-put-content-type-added"
    upload_content_type: "application/pdf"
    expected_action: "reject-before-signature-mismatch"

  - id: "signed-put-empty-content-type"
    upload_content_type: ""
    upload_body: "raw-file-bytes"
    expected_action: "continue"

  - id: "plaintext-token-persistence"
    token_written_to: "state-or-config-or-log-or-report"
    expected_action: "fail-secret-safety-gate"

  - id: "encrypted-token-persistence"
    token_file: "state/mineru-api-token.enc.json"
    plaintext_present: false
    file_mode: "0600"
    expected_action: "pass"

  - id: "wrong-token-store-wrapping-key"
    encrypted_token_file: "valid"
    keychain_key_match: false
    expected_action: "reject-without-api-request"

  - id: "tampered-encrypted-token"
    hmac_valid: false
    expected_action: "reject-before-decryption"

  - id: "poll-timeout"
    state: "running"
    elapsed_seconds: 300
    expected_action: "stop-and-report-redacted-batch-reference"

  - id: "batch-state-path"
    response_path: "data.extract_result[0].state"
    state: "done"
    expected_action: "read-per-file-state-and-result"

  - id: "incorrect-flat-state-path"
    response_path: "data.state"
    state: "unknown"
    expected_action: "reject-schema-before-poll-loop"

  - id: "unknown-state-for-thirty-seconds"
    state: "unknown"
    elapsed_seconds: 30
    expected_action: "stop-and-show-redacted-key-type-tree"

  - id: "poll-backoff"
    expected_intervals:
      elapsed_0_to_30: 3
      elapsed_31_to_120: 10
      elapsed_after_120: 30
    expected_action: "emit-only-state-transitions"

  - id: "ocr-not-confirmed"
    is_ocr: "unset"
    expected_action: "ask-before-submit"

  - id: "unsafe-zip-member"
    zip_member: "../../outside.md"
    expected_action: "reject-archive-before-extraction"

  - id: "nested-archive-member"
    zip_member: "nested-output.zip"
    expected_action: "reject-without-recursive-extraction"

  - id: "official-api-file-too-large"
    api_error: "-60005"
    expected_action: "stop-and-report-size-limit"

  - id: "official-api-page-limit"
    api_error: "-60006"
    expected_action: "stop-and-report-page-limit"
