schema_version: 1

cases:
  - id: "two-file-batch-requires-subagents"
    canvas_work_items: 2
    required_subagent_tasks: 2
    task_granularity: "one-document-each"
    authoring_parallel: true
    renderer_parallelism: 1
    expected_action: "spawn-two-and-serialize-dom"

  - id: "batch-over-capacity-uses-waves"
    canvas_work_items: 5
    available_subagent_slots: 2
    authoring_waves:
      - 2
      - 2
      - 1
    merged_document_tasks: 0
    renderer_parallelism: 1
    expected_action: "queue-without-merging"

  - id: "delegated-canvas-subskill"
    orchestrator_owns:
      - "complete-note"
      - "recall-model"
      - "paths-and-overwrite-boundary"
      - "final-package-validation"
    subagent_owns:
      - "layout"
      - "aesthetics"
      - "edge-routing"
      - "dom-measure-and-reflow"
    required_return:
      - "canvas"
      - "canvas-aesthetic-check.json"
      - "canvas-render-metrics.json"
      - "canvas-render-check.json"
    expected_action: "delegate-without-redrawing-in-main-agent"

  - id: "lecture-knowledge-recall-map"
    profile: "lecture-notes"
    required_zones:
      - "one-minute-recall"
      - "learning-modules"
      - "connected-concept-network"
      - "logic-chain"
      - "distinctions-and-boundaries"
      - "active-recall"
    expected_action: "render-from-semantic-model"

  - id: "section-order-is-not-knowledge"
    input_strategy: "connect-headings-in-document-order"
    edge_labels:
      - "contains section"
      - "followed by"
    expected_action: "reject-generic-outline"

  - id: "coverage-ledger"
    markdown_h2_count: 8
    coverage_rows: 8
    mapped_or_explained_rows: 8
    expected_action: "pass-with-traceable-compression"

  - id: "missing-section-coverage"
    markdown_h2_count: 8
    coverage_rows: 7
    expected_action: "reject-silent-omission"

  - id: "connected-selective-network"
    concept_nodes: 10
    semantic_edges: 13
    max_node_degree: 4
    expected_action: "pass"

  - id: "spaghetti-hub"
    concept_nodes: 12
    max_node_degree: 9
    expected_action: "reject-and-prioritize-relations"

  - id: "memory-critical-assets-only"
    extracted_assets: 18
    selected_asset_nodes: 3
    selection_basis: "needed-to-reconstruct-a-concept"
    expected_action: "link-selected-assets-to-concepts"

  - id: "post-class-refresh"
    mode: "post-class"
    input: "complete-markdown-with-in-class-notes"
    required_output: "confirmed-class-additions-in-recall-zone"
    expected_action: "rebuild-model-without-inventing-lecture-content"

  - id: "dom-height-reflow"
    workstation_profile: "mbp14-1512x982-composer-obsidian-1.13.7"
    first_pass_height: 440
    measured_exact_height: 559
    profile_height: 570
    expected_action: "rebuild-and-reflow-from-dom-metrics"

  - id: "compact-axton-informed-concept-card"
    title_level: "H3"
    statement_max_chars: 180
    details_max: 2
    per_card_recall_cue: false
    source_link: "compact-one-line"
    expected_action: "pass-aesthetic-density-gate"

  - id: "reading-font-at-one-to-one"
    canvas_font_px: 16
    canvas_zoom: 0
    effective_font_px: 16
    sidebar_reference_px: 13
    expected_action: "pass"

  - id: "fit-all-is-not-reading-proof"
    canvas_font_px: 16
    canvas_zoom: -2.48
    effective_font_px: 2.87
    expected_action: "orientation-only-not-readable"

  - id: "stale-render-check"
    delivered_canvas_sha256_matches_check: false
    expected_action: "reject"

  - id: "source-pdf-file-node"
    file: "lecture.pdf"
    expected_action: "reject-source-original-node"

  - id: "complete-vault-relative-markdown-path"
    vault_root: "/example/vault"
    document_folder: "/example/vault/COURSE101/Lectures/example-lesson"
    file_node: "COURSE101/Lectures/example-lesson/example-lesson.md"
    expected_action: "resolve-inside-document-folder"

  - id: "bare-markdown-filename"
    vault_root: "/example/vault"
    file_node: "example-lesson.md"
    expected_action: "reject-as-vault-root-relative-miss"
