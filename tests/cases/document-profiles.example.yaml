schema_version: 1

extraction_modes:
  - id: "native-default"
    mode: "native"
    requires_multimodal_model: true
    mineru_required: false
    page_markers_allowed: false
  - id: "mineru-aid"
    mode: "mineru"
    requires_multimodal_model: false
    mineru_required: true
    page_markers_allowed: true

note_granularity:
  - id: "always-ask"
    source_profile: "lecture-notes"
    expected_action: "ask-user-every-conversion"
    never_default: true
  - id: "single-note"
    requested_granularity: "single-note"
    notes_per_document: 1
    sections_as: "h2"
  - id: "section-notes"
    requested_granularity: "section-notes"
    notes_per_document: "one-per-source-section"
    minimum_sections_to_suggest: 3
    minimum_pages_to_suggest: 60
  - id: "section-note-slug-keeps-source-order"
    requested_granularity: "section-notes"
    slug_pattern: "<document-slug>-<NN>-<section-slug>"
    ordinals_contiguous_from: "01"
    filename_sort_matches_source_order: true
    rejected_when: "missing ordinal, non-contiguous ordinals, or notes out of source page order"

  - id: "section-notes-rejected-elsewhere"
    requested_granularity: "section-notes"
    profile: "policy-document"
    expected_action: "reject"

cases:
  - id: "slide-like-output"
    extraction_mode: "native"
    signals:
      - "short-page-blocks"
      - "repeated-page-titles"
      - "presentation-page-size"
    expected_profile: "lecture-notes"
    expected_tail_section: "In-class notes"
    expect_furniture_dropped: true
    expect_comparison_tables_as_markdown: true

  - id: "policy-document-output"
    signals:
      - "dense-prose"
      - "numbered-obligations"
      - "definitions-and-exceptions"
    expected_action: "ask-to-confirm-policy-document"
    preserve_source_numbering: true
    in_class_notes: false

  - id: "academic-paper-output"
    signals:
      - "abstract"
      - "methods"
      - "references"
    expected_action: "ask-to-confirm-paper"
    in_class_notes: false

  - id: "explicit-user-profile"
    requested_profile: "policy-document"
    expected_action: "use-requested-profile"
