schema_version: 1

cases:
  - id: "encrypted-token-round-trip"
    file: "state/mineru-api-token.enc.json"
    plaintext_present: false
    file_mode: "0600"
    directory_mode: "0700"
    expected_action: "decrypt-in-memory-only"

  - id: "wrong-keychain-wrapping-key"
    keychain_key_match: false
    expected_action: "reject-before-decryption"

  - id: "tampered-ciphertext"
    hmac_verification: "failed"
    expected_action: "reject-before-decryption"

  - id: "keychain-item-missing"
    expected_action: "replace-token-state-from-chat-provided-token"

  - id: "plaintext-token-file"
    file: "state/mineru-api-token.txt"
    expected_action: "reject-and-remove"

  - id: "uninstall-purge"
    purge_targets:
      - "course-registry.yaml"
      - "mineru-api-token.enc.json"
      - "macos-keychain-wrapping-key"
    expected_action: "remove-only-skill-owned-state"
